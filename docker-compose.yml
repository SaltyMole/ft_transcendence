services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: transcendance_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcendance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Containerfile
    container_name: transcendance_api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      APP_STAGE: production
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-transcendance}
      CORS_ORIGIN: https://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: ./AI
      dockerfile: Containerfile
    container_name: transcendance_ai
    ports:
      - "8000:8000"
    environment:
      API_BASE_URL: https://api:3000
      AI_REQUIRE_CUDA: "1"
      CC: gcc
      CXX: g++
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    security_opt:
      - label=disable
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia0:/dev/nvidia0
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: transcendance_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_certs:/app/frontend/certs
    command: >
      sh -c 'mkdir -p certs && if [ ! -f certs/key.pem ] || [ ! -f certs/cert.pem ]; then
      openssl req -x509 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem
      -days 365 -nodes -subj "/CN=localhost"
      -addext "subjectAltName=IP:127.0.0.1,DNS:localhost";
      fi && npm run dev -- --host 0.0.0.0'
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

  drizzle-studio:
    build:
      context: ./api
      dockerfile: Dockerfile.studio
    container_name: transcendance_studio
    ports:
      - "4983:4983"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-transcendance}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/src/db:/app/src/db
      - ./api/drizzle.config.ts:/app/drizzle.config.ts

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_certs:
